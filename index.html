<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ethan Roland</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ethan Roland — AI researcher in Atlanta, GA. Alignment and machine learning.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15231c;          /* deep dusk pine */
    --ink-2:#101a15;        /* shadow edge */
    --bone:#ece3d4;         /* warm parchment text */
    --sage:#9aa89c;         /* muted secondary */
    --rust:#d2622f;         /* sweater accent */
    --hair:rgba(236,227,212,.16);
    --serif:"Spectral", Georgia, serif;
    --sans:"Hanken Grotesk", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--bone);
    background:var(--ink);
    /* figure-ground echo: a warm dusk glow sits behind the portrait,
       fading to deep pine at the edges — the light that's on his face,
       extended across the whole page */
    background-image:
      radial-gradient(120% 90% at 50% 30%, rgba(210,98,47,.20) 0%, rgba(210,98,47,.06) 34%, transparent 62%),
      radial-gradient(140% 120% at 50% 120%, var(--ink-2) 0%, transparent 60%);
    background-attachment:fixed;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(28px,6vh,72px) 22px;
    gap:clamp(18px,3.2vh,30px);
  }

  /* portrait */
  .portrait{
    position:relative;
    width:clamp(208px,26vh,288px);
    aspect-ratio:700/1236;
    border-radius:16px;
    overflow:hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.04) inset,
      0 0 0 1px rgba(210,98,47,.28),
      0 24px 60px -22px rgba(0,0,0,.7),
      0 0 70px -10px rgba(210,98,47,.22);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .portrait img{
    display:block;
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 18%;
  }
  /* gentle top-light wash on the photo, matching the dusk source */
  .portrait::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(255,236,210,.10), transparent 38%);
    pointer-events:none;
  }

  /* identity */
  .name{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(2.3rem,7vw,3.4rem);
    line-height:1;
    letter-spacing:.005em;
    margin:0;
    animation:fade 1s ease .12s both;
  }
  .tagline{
    font-size:clamp(.74rem,2.4vw,.84rem);
    font-weight:600;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--sage);
    margin:0;
    animation:fade 1s ease .22s both;
  }
  .rule{
    width:46px;height:1px;border:0;margin:2px 0 0;
    background:var(--rust);opacity:.85;
    animation:fade 1s ease .3s both;
  }

  /* links */
  .links{
    display:flex;align-items:center;justify-content:center;
    flex-wrap:wrap;
    gap:14px clamp(14px,3.4vw,26px);
    max-width:440px;
    margin-top:2px;
    animation:fade 1s ease .38s both;
  }
  .links a{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--bone);text-decoration:none;
    font-size:.92rem;font-weight:500;letter-spacing:.01em;
    padding:6px 2px;
    border-bottom:1px solid transparent;
    transition:color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .links a svg{width:17px;height:17px;display:block;opacity:.9;transition:opacity .18s ease;}
  .links a:hover,.links a:focus-visible{color:var(--rust);border-color:var(--rust);outline:none;}
  .links a:hover svg,.links a:focus-visible svg{opacity:1;}
  /* on the tightest screens, show only the icons to keep one clean row */
  .label{display:inline;}

  footer{
    text-align:center;
    padding:0 22px 26px;
    color:var(--sage);
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    animation:fade 1s ease .5s both;
  }
  footer .dot{color:var(--rust);margin:0 .55em;}

  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  @media (max-width:380px){
    .label{display:none;}
    .links{gap:22px;}
    .links a svg{width:20px;height:20px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;}
  }
</style>
</head>
